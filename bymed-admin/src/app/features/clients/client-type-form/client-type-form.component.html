@if (isInitializing()) {
  <app-page-loading label="Loading client type..." />
} @else {
  <header class="page-header">
    <div>
      <h1 class="page-title">{{ isEditMode ? 'Edit Client Type' : 'Add Client Type' }}</h1>
      <p class="page-subtitle">
        {{ isEditMode ? 'Update the client type name and slug.' : 'Create a client type for grouping institutions.' }}
      </p>
    </div>
  </header>

  @if (errorMessage()) {
    <app-global-error [message]="errorMessage() ?? ''" />
  }

  <form class="entity-form-layout" [formGroup]="form" (ngSubmit)="submit()" novalidate>
    <section class="form-panel">
      <div class="form-panel__head">
        <h2 class="form-panel__title">Client Type Details</h2>
        <p class="form-panel__subtitle">Name and URL-friendly slug.</p>
      </div>

      <div class="field-group">
        <label for="name">Name</label>
        <input id="name" pInputText formControlName="name" class="full-width" />
      </div>

      <div class="field-group">
        <label for="slug">Slug</label>
        <input id="slug" pInputText formControlName="slug" class="full-width" />
      </div>
    </section>

    <aside class="form-sidebar">
      <div class="sidebar-actions">
        <button type="submit" class="btn-primary btn-block" [disabled]="isSubmitting()">
          @if (isSubmitting()) {
            <span>Saving...</span>
          } @else {
            <span>Save</span>
          }
        </button>
        <a class="outline-btn btn-block" routerLink="/client-types">Cancel</a>
      </div>
    </aside>
  </form>
}
